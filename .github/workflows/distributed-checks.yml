name: distributed-checks

on:
  push:
    branches: [v2, v2-distributed-execution]
  pull_request:
    branches: [v2]
  workflow_dispatch:

# Isolate runs using canonical macOS paths from earlier CI settings.
concurrency:
  group: distributed-canonical-temp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.os }} (${{ matrix.suite }})
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: ''
            suite: all
          - os: macos-latest
            suffix: ''
            suite: all
          - os: windows-latest
            suffix: '.exe'
            suite: services
          # The Windows board model passed in 71 minutes. Run it separately so
          # service failures are visible without waiting for the model search.
          - os: windows-latest
            suffix: '.exe'
            suite: board
    runs-on: ${{ matrix.os }}
    env:
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build client
        run: go build -o "${{ runner.temp }}/kander-check${{ matrix.suffix }}" ./cmd/kander
      - name: Build server
        run: go build -o "${{ runner.temp }}/kander-server-check${{ matrix.suffix }}" ./cmd/kander-server
      - name: Static analysis
        run: go vet ./...
      # Canonical short paths preserve no-follow checks and fit Unix sockets.
      - name: Import under the exclusive source lock
        env:
          TMPDIR: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TEMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
        run: go test -p 1 -count=1 -timeout 5m ./internal/fs ./internal/server -run '^(TestWindowsReadingLockedFilesPreservesEmptyAndNonemptySemantics|TestImport.*|TestOfflineMaintenance.*|TestMaintainCommand.*|TestIssueResult.*)$'
      - name: Concurrent lock and launcher regressions
        env:
          TMPDIR: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TEMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
        run: go test -p 1 -count=20 -timeout 10m ./internal/fs ./internal/board ./cmd/kander ./internal/launch -run '^(TestOpenLockFile.*|TestSortedBatchLocksAndConcurrentIndexAppend|TestBoardRootOverrideAfterCWDDeletion|TestLuvusLauncherStart|TestLateExecOfANativeWrapperIsNeverAMismatch|TestACardWriteBeforeTheExecRecordsNothing|TestForegroundIdentityWaitsForTheTaskFileRead|TestARemovedTaskFileCountsAsRead)$'
      # Disable the test result cache: large model-test input logs otherwise
      # require substantially more memory after the tests themselves finish.
      - name: Complete native tests
        if: matrix.suite == 'all'
        # runner is available at step scope, not in the job's env mapping.
        env:
          TMPDIR: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TEMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
        run: go test -p 1 -count=1 -timeout 150m ./...
      - name: Complete Windows service tests
        if: matrix.suite == 'services'
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          $packages = @(go list ./... | Where-Object { $_ -ne 'github.com/dualface/kander/internal/board' })
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -v -p 1 -count=1 -timeout 20m $packages
      - name: Complete Windows board tests
        if: matrix.suite == 'board'
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test -v -p 1 -count=1 -timeout 150m ./internal/board

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Distributed and lifecycle race tests
        run: go test -race -p 1 -count=1 -timeout 20m ./internal/server ./internal/worker ./internal/remote ./internal/launch ./internal/review ./internal/issue ./internal/liveness ./internal/tui

  dsh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plugin tests
        working-directory: integrations/kander-dsh
        run: node --test "test/*.test.mjs"
