name: distributed-checks

on:
  push:
    branches: [v2, v2-distributed-execution]
  pull_request:
    branches: [v2]
  workflow_dispatch:
    inputs:
      windows_extra_packages:
        description: >-
          Extra packages for the Windows services job, separated by spaces.
          Only ./internal/<path> and ./cmd/<path> are accepted.
        type: string
        required: false
        default: ''

# Isolate runs using canonical macOS paths from earlier CI settings.
concurrency:
  group: distributed-canonical-temp-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/v2' }}

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.os }} (${{ matrix.suite }})
    # The all jobs run go test with a 150-minute timeout; the Windows board job
    # skips the model search and needs far less.
    timeout-minutes: ${{ matrix.suite == 'board' && 60 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: ''
            suite: all
          - os: macos-latest
            suffix: ''
            suite: all
          - os: windows-latest
            suffix: '.exe'
            suite: services
          # The Windows board tests run in a job of their own so that service
          # failures are visible without waiting for them.
          - os: windows-latest
            suffix: '.exe'
            suite: board
    runs-on: ${{ matrix.os }}
    env:
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build kander
        run: go build -o "${{ runner.temp }}/kander-check${{ matrix.suffix }}" ./cmd/kander
      - name: Static analysis
        run: go vet ./...
      # Canonical short paths preserve no-follow checks and fit Unix sockets.
      - name: Import under the exclusive source lock
        env:
          TMPDIR: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TEMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
        run: go test -p 1 -count=1 -timeout 5m ./internal/fs ./internal/server -run '^(TestWindowsReadingLockedFilesPreservesEmptyAndNonemptySemantics|TestImport.*|TestOfflineMaintenance.*|TestMaintainCommand.*|TestIssueResult.*)$'
      - name: Concurrent lock and launcher regressions
        env:
          TMPDIR: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TEMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
        run: go test -p 1 -count=20 -timeout 10m ./internal/fs ./internal/board ./cmd/kander ./internal/launch -run '^(TestOpenLockFile.*|TestSortedBatchLocksAndConcurrentIndexAppend|TestBoardRootOverrideAfterCWDDeletion|TestLuvusLauncherStart|TestLateExecOfANativeWrapperIsNeverAMismatch|TestACardWriteBeforeTheExecRecordsNothing|TestForegroundIdentityWaitsForTheTaskFileRead|TestARemovedTaskFileCountsAsRead)$'
      # Disable the test result cache: large model-test input logs otherwise
      # require substantially more memory after the tests themselves finish.
      - name: Complete native tests
        if: matrix.suite == 'all'
        # runner is available at step scope, not in the job's env mapping.
        env:
          TMPDIR: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TEMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
        run: go test -p 1 -count=1 -timeout 150m ./...
      # internal/remote's platform-neutral tests run in the ubuntu-latest all job
      # and the race job; by default only its TestWindows tests run on Windows, in
      # the next step. A dispatch can add the whole package, see the extra step.
      - name: Complete Windows service tests
        if: matrix.suite == 'services'
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          $packages = @(go list ./... | Where-Object { $_ -ne 'github.com/dualface/kander/internal/board' -and $_ -ne 'github.com/dualface/kander/internal/remote' })
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -v -p 1 -count=1 -timeout 20m $packages
      # Windows-specific tests of internal/remote, named TestWindows*, such as the
      # TestWindowsCredentialSharing tests planned by
      # 20261119-windows-credential-read-sharing-v2-task. With no match go test
      # reports "no tests to run" and exits 0.
      - name: Windows-specific remote tests
        if: ${{ !cancelled() && matrix.suite == 'services' }}
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test -v -p 1 -count=1 -timeout 15m ./internal/remote -run '^TestWindows'
      # A dispatch can name extra packages to test on Windows, for example
      # -f windows_extra_packages=./internal/remote. The value reaches the script
      # only through env and must name ./internal or ./cmd packages.
      - name: Extra Windows packages
        if: ${{ !cancelled() && matrix.suite == 'services' && inputs.windows_extra_packages != '' }}
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          WINDOWS_EXTRA_PACKAGES: ${{ inputs.windows_extra_packages }}
        shell: pwsh
        run: |
          $packages = @($env:WINDOWS_EXTRA_PACKAGES -split '\s+' | Where-Object { $_ -ne '' })
          foreach ($package in $packages) {
            if ($package -cnotmatch '^\./(internal|cmd)(/[A-Za-z0-9_-]+)+\z') {
              Write-Error "windows_extra_packages: refused package path: $package"
            }
          }
          if ($packages.Count -eq 0) { exit 0 }
          go test -v -p 1 -count=1 -timeout 30m -skip '^TestModelCompositeStates$' $packages
          exit $LASTEXITCODE
      # TestModelCompositeStates searches abstract board states, so its pass or
      # fail result does not depend on the platform; only the temporary directory
      # it uses is chosen per platform. The ubuntu-latest all job runs it in
      # default mode (as does macos-latest); on Windows it alone took 67 minutes
      # (run 44410469265).
      - name: Complete Windows board tests
        if: matrix.suite == 'board'
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test -v -p 1 -count=1 -timeout 30m -skip '^TestModelCompositeStates$' ./internal/board

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Distributed and lifecycle race tests
        run: go test -race -p 1 -count=1 -timeout 20m ./internal/server ./internal/worker ./internal/remote ./internal/launch ./internal/review ./internal/issue ./internal/liveness ./internal/tui

  dsh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plugin tests
        working-directory: integrations/kander-dsh
        run: node --test "test/*.test.mjs"
