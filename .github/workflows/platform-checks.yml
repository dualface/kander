name: platform-checks

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    # Above the model step's go test timeout, so the test, not the runner, ends a
    # slow search and prints its goroutine dump.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Delivery and overlap tests
        run: |
          go test ./internal/check -count=1
          go test ./cmd/kander -count=1 -run TestCheck
      # A checkout that converts line endings would embed CRLF rules and templates.
      - name: Embedded line endings
        if: ${{ !cancelled() }}
        run: go test ./rules ./internal/board ./internal/issue ./internal/config -count=1 -v -run TestEmbeddedFilesUseLF
      # One command per step: a PowerShell step exits with the last command's code.
      # The runner temp directory is real on macOS, where the default temp path is
      # a symlink the board refuses, and it is the fast drive on Windows.
      # The process tests come first and run past each other's failure, so one run
      # reports all of them without waiting for the model test.
      - name: Process identity tests
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test -v ./internal/process -count=1
      - name: Liveness tests
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test -v ./internal/liveness -count=1
      # Every test of internal/launch/late_failure_test.go.
      - name: Late failure tests
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test -v ./internal/launch -count=1 -run '^(TestLateFailureKeepsAnExecutorThatWorked|TestLateFailureWithoutEvidenceClosesAndRollsBack|TestStandingIsReadBeforeTheContainerCloses|TestEvidenceSurvivesASuccessfulWindowWrite|TestFailedCloseDoesNotRollBack|TestWriteAfterTheJudgementEndsUnresolved|TestUnreadableStandingKeepsTheContainer|TestSupersededStartExitsNormally|TestLateFailureWithoutAContainer|TestUnresolvedOutputAndExitStatus|TestTakeoverLateFailureEndsUnresolved|TestTakeoverDecisionRequirement|TestResumeRefusesMixedAdoptOptions|TestAdoptKeepsTheExecutor|TestAdoptRefusesAnExecutorWithoutProcessIdentity|TestSessionRepairWaitsForAnUnfinishedStart|TestGroupMemberLeavesUnresolvedByAdoption|TestGroupMemberLeavesUnresolvedByTakeover)$'
      # The real process table: /proc on Linux and ps on macOS. The POSIX tests do
      # not build on Windows, so the job-object test keeps the pattern alive there.
      - name: Reviewer process group tests
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test -v ./internal/review -count=1 -run '^(TestProcessTableHasIdentity|TestChildExitingDuringRecheckIsNotLeftover|TestLeftoverIsRejectedCollectedAndAttributed|TestAbnormalEndsSkipTheRecheck|TestWindowsDelayedTamperCollected)$'
      # Windows takes 60 to 85 minutes here (docs/model-test.md). -v prints each
      # scenario's size and time as it ends, also in a run that times out.
      - name: Composite state model, default mode
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test ./internal/board -count=1 -v -timeout 150m -run TestModel
      - name: Directed dead-end tests
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test ./internal/launch -count=1 -v -run "TestLateFailureKeepsAnExecutorThatWorked|TestStartConfirmsSessionOverExecutorWrite|TestPaneDeliveryExecutorWriteKeepsTheStart|TestTakeoverDiscoverySurvivesExecutorWrite|TestCompletedWrapUpVerifiesGitOnce"
      - name: Workflow test patterns
        if: ${{ !cancelled() }}
        run: go test ./cmd/kander -count=1 -v -run TestWorkflowRunPattern

  # The dsh plugin is POSIX only, like the dsh launcher it serves.
  kander-dsh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plugin tests
        working-directory: integrations/kander-dsh
        run: node --test "test/*.test.mjs"

  model-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Composite state model, full mode
        env:
          KANDER_MODEL_DEPTH: full
        run: go test ./internal/board -count=1 -timeout 30m -run TestModelCompositeStates
