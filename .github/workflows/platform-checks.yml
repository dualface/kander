name: platform-checks

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Delivery and overlap tests
        run: |
          go test ./internal/check -count=1
          go test ./cmd/kander -count=1 -run TestCheck
      - name: Composite state model, default mode
        run: |
          go test ./internal/board -count=1 -timeout 30m -run TestModel
          go test ./internal/launch -count=1 -run "TestDeadEnd|TestCoordinatorRechecksActualGitAfterWrapUpRestart"

  model-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Composite state model, full mode
        env:
          KANDER_MODEL_DEPTH: full
        run: go test ./internal/board -count=1 -timeout 30m -run TestModelCompositeStates
