name: platform-checks

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Delivery and overlap tests
        run: |
          go test ./internal/check -count=1
          go test ./cmd/kander -count=1 -run TestCheck
      # A checkout that converts line endings would embed CRLF rules and templates.
      - name: Embedded line endings
        if: ${{ !cancelled() }}
        run: go test ./rules ./internal/board ./internal/issue ./internal/config -count=1 -v -run TestEmbeddedFilesUseLF
      # One command per step: a PowerShell step exits with the last command's code.
      # The runner temp directory is real on macOS, where the default temp path is
      # a symlink the board refuses, and it is the fast drive on Windows.
      # The process tests come first and run past each other's failure, so one run
      # reports all of them.
      - name: Process identity tests
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test -v ./internal/process -count=1
      - name: Liveness tests
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test -v ./internal/liveness -count=1
      # Every test of internal/launch/late_failure_test.go.
      - name: Late failure tests
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test -v ./internal/launch -count=1 -run '^(TestLateFailureKeepsAnExecutorThatWorked|TestLateFailureWithoutEvidenceClosesAndRollsBack|TestStandingIsReadBeforeTheContainerCloses|TestEvidenceSurvivesASuccessfulWindowWrite|TestFailedCloseDoesNotRollBack|TestWriteAfterTheJudgementEndsUnresolved|TestUnreadableStandingKeepsTheContainer|TestSupersededStartExitsNormally|TestLateFailureWithoutAContainer|TestUnresolvedOutputAndExitStatus|TestTakeoverLateFailureEndsUnresolved|TestTakeoverDecisionRequirement|TestResumeRefusesMixedAdoptOptions|TestAdoptKeepsTheExecutor|TestAdoptRefusesAnExecutorWithoutProcessIdentity|TestSessionRepairWaitsForAnUnfinishedStart|TestGroupMemberLeavesUnresolvedByAdoption|TestGroupMemberLeavesUnresolvedByTakeover)$'
      # The real process table: /proc on Linux and ps on macOS. The POSIX tests do
      # not build on Windows, so the job-object test keeps the pattern alive there.
      - name: Reviewer process group tests
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test -v ./internal/review -count=1 -run '^(TestProcessTableHasIdentity|TestChildExitingDuringRecheckIsNotLeftover|TestChildExitingLateInTheRecheckIsNotLeftover|TestLeftoverIsRejectedCollectedAndAttributed|TestAbnormalEndsSkipTheRecheck|TestWindowsDelayedTamperCollected)$'
      - name: Directed dead-end tests
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test ./internal/launch -count=1 -v -run "TestLateFailureKeepsAnExecutorThatWorked|TestStartConfirmsSessionOverExecutorWrite|TestPaneDeliveryExecutorWriteKeepsTheStart|TestTakeoverDiscoverySurvivesExecutorWrite|TestCompletedWrapUpVerifiesGitOnce"
      # The Windows acceptance set of the herdr-core launcher: real PowerShell for the typed
      # line, a fake hc for the rest. It runs only here with powershell.exe and cmd.exe.
      - name: Windows herdr-core tests
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test ./cmd/kander ./internal/launch ./internal/menu ./internal/terminal ./internal/terminal/builtin -count=1 -v -run '^(TestWindowsHerdrCore|TestPowerShell)'
      - name: Workflow test patterns
        if: ${{ !cancelled() }}
        run: go test ./cmd/kander -count=1 -v -run TestWorkflowRunPattern

  # The dsh plugin is POSIX only, like the dsh launcher it serves.
  kander-dsh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plugin tests
        working-directory: integrations/kander-dsh
        run: node --test "test/*.test.mjs"

  # The only full-mode run of the composite state model: its result does not
  # depend on the platform, and Windows needs over an hour for the default mode
  # alone. distributed-checks.yml runs the default mode on Linux and macOS. The
  # step is skipped when no test dependency of the search changed, see
  # scripts/model-test-scope.sh.
  model-full:
    runs-on: ubuntu-latest
    steps:
      # The decision needs the history to find the base of the change.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      # Any failure of the decision leaves its output unset, and the search then
      # runs.
      - name: Decide whether the model search runs
        id: model_scope
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          FULL_REFS: refs/heads/main refs/heads/develop refs/heads/v2
          WORKFLOW_FILE: .github/workflows/platform-checks.yml
        run: bash scripts/model-test-scope.sh
      - name: Composite state model, full mode
        if: steps.model_scope.outputs.run != 'false'
        env:
          KANDER_MODEL_DEPTH: full
        run: go test ./internal/board -count=1 -v -timeout 30m -run TestModel
