# Build and publish a GitHub release when a v* tag is pushed.
# Cross-compiles the pure-Go binary for all supported platforms on one runner.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Exposed as env so the tap step can skip itself when the secret is absent;
    # the secrets context is not available in a step-level `if`.
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate release tag
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build all platforms
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          VERSION_PACKAGE=github.com/dualface/kander/internal/version
          LDFLAGS="-s -w -X ${VERSION_PACKAGE}.Version=${VERSION}"

          mkdir -p dist
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            bin=kander
            [ "$GOOS" = windows ] && bin=kander.exe
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS" -o "dist/$bin" ./cmd/kander
            name="kander-${GOOS}-${GOARCH}"
            if [ "$GOOS" = windows ]; then
              (cd dist && zip -q "${name}.zip" "$bin" && rm "$bin")
            else
              tar -czf "dist/${name}.tar.gz" -C dist "$bin"
              rm "dist/$bin"
            fi
            echo "packaged ${name}"
          done

          (cd dist && sha256sum -- * > checksums.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: kander ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt

      # Rewrites Formula/kander.rb in dualface/homebrew-tap from the checksums
      # just published. Needs TAP_TOKEN: a PAT with contents:write on the tap
      # repo (GITHUB_TOKEN cannot push to another repository). Without the
      # secret the release still succeeds and the formula must be synced by
      # hand with: scripts/release.sh --skip-tag <tag>
      - name: Sync Homebrew tap
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          ./scripts/release.sh --skip-tag --no-test "${GITHUB_REF_NAME}"
