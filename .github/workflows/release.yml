# Build and publish a GitHub release when a v* tag is pushed.
# Cross-compiles the pure-Go binary for all supported platforms on one runner.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate release tag
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build all platforms
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          VERSION_PACKAGE=github.com/dualface/kander/internal/version
          LDFLAGS="-s -w -X ${VERSION_PACKAGE}.Version=${VERSION}"

          mkdir -p dist
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            bin=kander
            [ "$GOOS" = windows ] && bin=kander.exe
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS" -o "dist/$bin" ./cmd/kander
            name="kander-${GOOS}-${GOARCH}"
            if [ "$GOOS" = windows ]; then
              (cd dist && zip -q "${name}.zip" "$bin" && rm "$bin")
            else
              tar -czf "dist/${name}.tar.gz" -C dist "$bin"
              rm "dist/$bin"
            fi
            echo "packaged ${name}"
          done

          (cd dist && sha256sum -- * > checksums.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: kander ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
