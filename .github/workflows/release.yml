# Build and publish a GitHub release when a v* tag is pushed.
# Cross-compiles the pure-Go binary for all supported platforms on one runner.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Exposed as env so the tap step can skip itself when the secret is absent;
    # the secrets context is not available in a step-level `if`.
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      # The v2 branch releases only 2.x: v2.Y.Z, or a prerelease
      # v2.Y.Z-(alpha|beta|rc).N. scripts/release.sh checks the same pattern,
      # and the self-update channels of internal/install accept only these.
      - name: Validate release tag
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]

      # The tests ran before the tag: scripts/release.sh tags a commit only when
      # release-gate.yml succeeded on it.
      - name: Static analysis
        run: go vet ./...

      - name: Build all platforms
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          VERSION_PACKAGE=github.com/dualface/kander/v2/internal/version
          LDFLAGS="-s -w -X ${VERSION_PACKAGE}.Version=${VERSION}"

          mkdir -p dist
          # Each archive contains the single kander executable.
          for program in kander; do
            for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
              GOOS="${target%/*}"
              GOARCH="${target#*/}"
              bin="$program"
              [ "$GOOS" = windows ] && bin="$program.exe"
              CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
                go build -trimpath -ldflags "$LDFLAGS" -o "dist/$bin" "./cmd/$program"
              name="${program}-${GOOS}-${GOARCH}"
              if [ "$GOOS" = windows ]; then
                (cd dist && zip -q "${name}.zip" "$bin" && rm "$bin")
              else
                tar -czf "dist/${name}.tar.gz" -C dist "$bin"
                rm "dist/$bin"
              fi
              echo "packaged ${name}"
            done
          done

          (cd dist && sha256sum -- * > checksums.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: kander ${{ env.VERSION }}
          generate_release_notes: true
          # A tag with a suffix (v2.Y.Z-alpha|beta|rc.N) is a prerelease. It
          # never becomes the latest release, so the update check of v1
          # clients (releases/latest) never offers it; v2 prerelease clients
          # find it in the releases list.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt

      # Rewrites Formula/kander.rb (releases) or Formula/kander-beta.rb
      # (prereleases) in dualface/homebrew-tap from the checksums just
      # published. Needs HOMEBREW_TAP_TOKEN: a PAT with contents:write on the
      # tap repo (GITHUB_TOKEN cannot push to another repository). Without the
      # secret the release still succeeds and the formula must be synced by
      # hand with: scripts/release.sh --skip-tag <tag>
      - name: Sync Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          ./scripts/release.sh --skip-tag --no-test "${GITHUB_REF_NAME}"

  # Builds the Microsoft Store upload bundle on a Windows runner and attaches
  # it to the release. Stable tags only: an MSIX version cannot carry a
  # prerelease suffix. msix.yml skips itself with a notice while the Store
  # identity variables are unset; see docs/windows-msix-store.md.
  msix:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/msix.yml
    with:
      tag: ${{ github.ref_name }}

  # Tells dualface/kander-commercial about the published v2 tag with a
  # repository_dispatch event, so its CI builds, tests, and packages the commit
  # the tag points at. Runs after every successful release job, prereleases
  # included. The release is already published here, so a missing secret skips
  # the call with a notice and a failed call only warns; neither fails the
  # release. Needs KANDER_COMMERCIAL_DISPATCH_TOKEN: a fine-grained PAT with
  # Contents read/write on dualface/kander-commercial only (GITHUB_TOKEN cannot
  # dispatch to another repository). No checkout and no GITHUB_TOKEN
  # permissions: the step reads only the two env values below. The receiver
  # contract (event type, payload) lives in kander-commercial; see AGENTS.md
  # "Releases".
  notify-commercial:
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.KANDER_COMMERCIAL_DISPATCH_TOKEN }}
      # On a tag push github.sha is the commit the tag points at, also for an
      # annotated tag; the release job's checkout fetches this same commit.
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Notify kander-commercial
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice::KANDER_COMMERCIAL_DISPATCH_TOKEN is not set; kander-commercial is not notified for this release."
            exit 0
          fi
          # The receiver rejects anything but 40 lowercase hex characters.
          if ! [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::The release commit is not a 40-character lowercase hex SHA; kander-commercial is not notified for this release."
            exit 0
          fi
          status=0
          gh api --method POST repos/dualface/kander-commercial/dispatches \
            -f event_type=kander-released \
            -f "client_payload[sha]=${RELEASE_SHA}" || status=$?
          if [ "${status}" -ne 0 ]; then
            echo "::warning::Notifying kander-commercial failed (gh exit ${status}, see the error above). Check whether KANDER_COMMERCIAL_DISPATCH_TOKEN has expired or lacks Contents read/write on dualface/kander-commercial, then rerun its CI by hand (workflow_dispatch)."
            exit 0
          fi
          echo "Notified kander-commercial: kander-released ${RELEASE_SHA}"
