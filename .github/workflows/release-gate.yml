name: release-gate

# The full test suite of v2, run before a release. scripts/release.sh tags a
# commit only when a run of this workflow succeeded on that exact commit. The
# daily distributed-checks.yml job checks formatting, vet and the build on the
# three platforms and runs the platform-neutral tests only.
#
# Dispatch it on the branch to release:
#   gh workflow run release-gate.yml --repo dualface/kander --ref v2
# or push the commit to a branch below release-gate/:
#   git push origin HEAD:refs/heads/release-gate/<name>
# The push trigger exists because GitHub refuses to dispatch a workflow that is
# not on the default branch (main, the v1 line) until a push or another event
# has run it once (HTTP 404 "workflow release-gate.yml not found on the default
# branch"). scripts/release.sh accepts a successful run of either trigger, as
# long as it ran on the commit to tag.
on:
  push:
    branches: ['release-gate/**']
  workflow_dispatch:
    inputs:
      windows_extra_packages:
        description: >-
          Extra packages for the Windows services job, separated by spaces.
          Only ./internal/<path> and ./cmd/<path> are accepted.
        type: string
        required: false
        default: ''

# One gate per ref at a time; a later dispatch waits for the running one, so
# every requested commit gets its result.
concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The native jobs come from the shard plan .github/release-gate-shards.json,
  # built by scripts/gateshards from the go test -json timings of an earlier
  # gate run; docs/release-gate.md describes it and when to regenerate it.
  plan:
    name: Shard plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Read the shard plan
        id: matrix
        run: |
          matrix=$(go run ./scripts/gateshards matrix)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  native:
    name: Native ${{ matrix.platform }} (${{ matrix.shard }})
    needs: plan
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Every go test call writes its go test -json stream below
    # $RUNNER_TEMP/test-json; the last step uploads it. The data feeds the next
    # shard plan. (runner.temp is not available in the job's env mapping.)
    env:
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      # The build, vet, Import and concurrent lock steps run once per platform,
      # in the shard the plan marks common.
      - name: Build kander
        if: matrix.common
        run: go build -o "${{ runner.temp }}/kander-check${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/kander
      - name: Static analysis
        if: matrix.common
        run: go vet ./...
      # Canonical short paths preserve no-follow checks and fit Unix sockets.
      - name: Import under the exclusive source lock
        if: matrix.common
        shell: bash
        env:
          TMPDIR: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TEMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
        run: bash scripts/go-test-json.sh "$RUNNER_TEMP/test-json/import.json" -p 1 -count=1 -timeout 5m ./internal/fs ./internal/server -run '^(TestWindowsReadingLockedFilesPreservesEmptyAndNonemptySemantics|TestImport.*|TestOfflineMaintenance.*|TestMaintainCommand.*|TestIssueResult.*)$'
      - name: Concurrent lock and launcher regressions
        if: ${{ !cancelled() && matrix.common }}
        shell: bash
        env:
          TMPDIR: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TEMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
        run: bash scripts/go-test-json.sh "$RUNNER_TEMP/test-json/concurrent-locks.json" -p 1 -count=20 -timeout 10m ./internal/fs ./internal/board ./cmd/kander ./internal/launch -run '^(TestOpenLockFile.*|TestSortedBatchLocksAndConcurrentIndexAppend|TestBoardRootOverrideAfterCWDDeletion|TestLuvusLauncherStart|TestLateExecOfANativeWrapperIsNeverAMismatch|TestACardWriteBeforeTheExecRecordsNothing|TestForegroundIdentityWaitsForTheTaskFileRead|TestARemovedTaskFileCountsAsRead)$'
      # The packages each platform tests. ubuntu tests every package, the model
      # search TestModelCompositeStates included. macOS and Windows test the
      # operating-system packages of scripts/platform-test-packages.sh, plus
      # internal/board and internal/remote; the plan's filters narrow those
      # two (docs/model-test.md). The rest shard of the plan runs every listed
      # package that no plan entry names, so a new package needs no new plan.
      # The script runs under bash, because the bash of a pwsh step may be the
      # one of WSL.
      - name: List the packages of the platform
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = ubuntu ]; then
            go list ./... > "$RUNNER_TEMP/universe.txt"
          else
            bash scripts/platform-test-packages.sh > "$RUNNER_TEMP/universe.txt"
            go list ./internal/board ./internal/remote >> "$RUNNER_TEMP/universe.txt"
          fi
          cat "$RUNNER_TEMP/universe.txt"
      # Disable the test result cache: large model-test input logs otherwise
      # require substantially more memory after the tests themselves finish.
      - name: Shard tests
        if: ${{ !cancelled() }}
        shell: bash
        env:
          TMPDIR: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
          TEMP: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
        run: go run ./scripts/gateshards run -platform "${{ matrix.platform }}" -shard "${{ matrix.shard }}" -universe "$RUNNER_TEMP/universe.txt" -json-dir "$RUNNER_TEMP/test-json"
      # A dispatch can name extra packages to test on Windows, for example
      # -f windows_extra_packages=./internal/remote. The value reaches the script
      # only through env and must name ./internal or ./cmd packages.
      - name: Extra Windows packages
        if: ${{ !cancelled() && matrix.platform == 'windows' && matrix.common && inputs.windows_extra_packages != '' }}
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          WINDOWS_EXTRA_PACKAGES: ${{ inputs.windows_extra_packages }}
        run: |
          read -r -a packages <<<"$WINDOWS_EXTRA_PACKAGES"
          for package in "${packages[@]}"; do
            if ! [[ $package =~ ^\./(internal|cmd)(/[A-Za-z0-9_-]+)+$ ]]; then
              echo "windows_extra_packages: refused package path: $package" >&2
              exit 1
            fi
          done
          if [ "${#packages[@]}" -eq 0 ]; then exit 0; fi
          bash scripts/go-test-json.sh "$RUNNER_TEMP/test-json/extra.json" -p 1 -count=1 -timeout 30m -skip '^TestModelCompositeStates$' "${packages[@]}"
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-json-native-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-json/
          if-no-files-found: warn
          retention-days: 30

  race:
    name: race (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Each shard leaves room for one package to reach the 20-minute go test
    # timeout and still print its panic before the job is canceled. With -p 1
    # the packages run in the listed order, so the slowest come last: a hang
    # then waits only for the faster packages before it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: server
            packages: ./internal/server
          - shard: launch-review
            packages: ./internal/issue ./internal/liveness ./internal/review ./internal/launch
          - shard: remote-worker-tui
            packages: ./internal/tui ./internal/worker ./internal/remote
    env:
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Distributed and lifecycle race tests
        env:
          PACKAGES: ${{ matrix.packages }}
        # PACKAGES is a space-separated list; bash splits it into arguments.
        run: |
          # shellcheck disable=SC2086
          bash scripts/go-test-json.sh "$RUNNER_TEMP/test-json/race.json" -race -p 1 -count=1 -timeout 20m $PACKAGES
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-json-race-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-json/
          if-no-files-found: warn
          retention-days: 30

  dsh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plugin tests
        working-directory: integrations/kander-dsh
        run: node --test "test/*.test.mjs"
